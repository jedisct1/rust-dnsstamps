[package]
name = "dnsstamps"
version = "0.1.11"
edition = "2018"
authors = ["Frank Denis <github@pureftpd.org>"]
description = "Create and serialize DNS stamps (sdns://) for DNSCrypt, DNS over HTTPS (DoH), Oblivious DoH (ODoH), and relays."
keywords = ["dns", "dnscrypt", "doh", "dns-stamps", "odoh"]
readme = "README.md"
license = "ISC"
homepage = "https://github.com/jedisct1/rust-dnsstamps"
repository = "https://github.com/jedisct1/rust-dnsstamps"

[dependencies]
ct-codecs = "1.1.7"
byteorder = "1.5.0"
